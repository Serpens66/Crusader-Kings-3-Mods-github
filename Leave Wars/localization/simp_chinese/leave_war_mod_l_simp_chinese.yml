 # Independent optional consequences; no forced save migration.
 rule_lw_mod_personality: "退出战争：性格"
 setting_lw_mod_personality_on: "启用"
 setting_lw_mod_personality_on_desc: "根据特质改变压力：忠诚 +40，公正 +20，不忠 -30，无情 -5，专断 -5。数值相加。没有基础压力，也不改变精神满足感。独立于原有六种费用设置，包括免费退出。"
 setting_lw_mod_personality_off: "禁用"
 setting_lw_mod_personality_off_desc: "通过本模组退出战争不会改变压力。"
 rule_lw_mod_contract_failure: "退出战争：违背援助合同"
 setting_lw_mod_contract_failure_on: "启用"
 setting_lw_mod_contract_failure_on_desc: "放弃合同约定的战争援助会受到原版的失败惩罚，持续10年，使今后的援助提议更难被接受。独立于原有六种费用设置，包括免费退出。即使关闭此惩罚，也会失去约定的报酬。"
 setting_lw_mod_contract_failure_off: "禁用"
 setting_lw_mod_contract_failure_off_desc: "取消所选战争的援助合同并放弃未来报酬，但不施加额外的失败惩罚。"
 lw_mod_contract_abandoned_tt: "你放弃了这场战争的援助合同及其未来报酬。"
 lw_mod_contract_failure_tt: "今后10年内，你提出的有偿战争援助更难被接受。"
