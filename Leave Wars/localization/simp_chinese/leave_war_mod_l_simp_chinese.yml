 # PREVENT error.log spam because of bug within the game
 # for whatever reason remove_participant triggers "REMOVE_PARTICIPANT_EFFECT_THIRD" (from effects_l_english.yml) instead of "REMOVE_PARTICIPANT_EFFECT_FIRST" in the tooltip of event, causing ALOT of error.log entries about missing CHARACTER. WAR is known, but CHARACTER not. I think this is a bug somewhere in the devs code that triggers the wrong tooltip.
 # copied from "effects_l_english.yml" from game files. REMOVE_PARTICIPANT_EFFECT_THIRD gets the string from REMOVE_PARTICIPANT_EFFECT_FIRST, because a bug from the game makes it use "third" instead of "first"
