# Prestige
 convert_resources_events.02.t:0 "Chancellor Assembled"
 convert_resources_events.02.desc:0 "\"How much gold [gold_i] you need in exchange for political favour?\"\n\nYou will get the gold half instant and half as income.\nChoose one of:\n300[prestige_i] -> 150[gold_i]\n500[prestige_i] -> 300[gold_i]\n1000[prestige_i] -> 650[gold_i]\n1500[prestige_i] -> 1000[gold_i]"
 convert_resources_events.02.a:0 "300[prestige_i] -> 150[gold_i]"
 convert_resources_events.02.b:0 "500[prestige_i] -> 300[gold_i]"
 convert_resources_events.02.c:0 "1000[prestige_i] -> 650[gold_i]"
 convert_resources_events.02.d:0 "1500[prestige_i] -> 1000[gold_i]"
 convert_resources_events.02.e:0 "I changed my mind."
 convert_resources_events.02.e.tt:0 "Change the subject."

