# Loan
 convert_resources_events.04.t:0 "Steward Assembled"
 convert_resources_events.04.desc:0 "\"How much gold [gold_i] should we #S borrow#!?\"\n\nChoose one of:\n\n150[gold_i] -> 200[gold_i] 5 years ~6.67%\n300[gold_i] -> 350[gold_i] 6 years ~2.78%\n500[gold_i] -> 625[gold_i] 10 years ~2.50%\n1000[gold_i] -> 1250[gold_i] 15 years ~1.67%"
 convert_resources_events.04.a:0 "Small loan."
 convert_resources_events.04.a.tt:0 "Relatively high interest."
 convert_resources_events.04.b:0 "Reasonable loan."
 convert_resources_events.04.b.tt:0 "Reasonable expenses."
 convert_resources_events.04.c:0 "Considerable loan."
 convert_resources_events.04.c.tt:0 "Relatively low expenses, longer payback time."
 convert_resources_events.04.d:0 "Large loan."
 convert_resources_events.04.d.tt:0 "Low expenses, even longer payback time."
 convert_resources_events.04.e:0 "I changed my mind."
 convert_resources_events.04.e.tt:0 "Change the subject."

# Loan_expensive
 convert_resources_events.05.t:0 "Steward Assembled"
 convert_resources_events.05.desc:0 "\"How much gold [gold_i] should we #S borrow#!?\"\nThe interest is based on my age and health.\n\nChoose one of:\n150[gold_i] -> 200[gold_i] 3 years ~11.11%\n300[gold_i] -> 375[gold_i] 4 years ~6.25%\n500[gold_i] -> 650[gold_i] 8 years ~3.75%\n1000[gold_i] -> 1300[gold_i] 10 years ~3.00%"
 convert_resources_events.05.a:0 "Small loan."
 convert_resources_events.05.a.tt:0 "High interest."
 convert_resources_events.05.b:0 "Reasonable loan."
 convert_resources_events.05.b.tt:0 "Relatively high expenses."
 convert_resources_events.05.c:0 "Considerable loan."
 convert_resources_events.05.c.tt:0 "Reasonable expenses, shorter payback time than normally."
 convert_resources_events.05.d:0 "Large loan."
 convert_resources_events.05.d.tt:0 "Lower expenses, even shorter payback time than normally."
 convert_resources_events.05.e:0 "I changed my mind."
 convert_resources_events.05.e.tt:0 "Change the subject."

# Extortion
 convert_resources_events.06.t:0 "Marshal Assembled"
 convert_resources_events.06.desc:0 "\"How much should we force them to pay?\"\n\nYou will get the gold half instant and half as income.\nThis will force payments from all your [courtiers] and direct [vassals], except [children], your [spouse] and your [player_heir]. The people won't like this and you may need to use #N violence #! to get the requested amount of [gold_i]!"
 convert_resources_events.06.a:0 "Charge everyone a small amount. 150 [gold_i]"
 convert_resources_events.06.b:0 "Demand a reasonable amount. 300 [gold_i]"
 convert_resources_events.06.c:0 "Force all my subjects to pay for my cause. 500 [gold_i]"
 convert_resources_events.06.d:0 "Take everything they've got! 1000 [gold_i]"
 convert_resources_events.06.e:0 "I changed my mind."
 convert_resources_events.06.e.tt:0 "Change the subject."

