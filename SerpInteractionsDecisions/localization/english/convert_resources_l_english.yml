 convert_resources_events.03.desc:0 "\"How much gold [gold_i] you need in exchange for theological favour?\"\n\nYou will get the gold half instant and half as income.\nChoose one of:\n300[piety_i] -> 150[gold_i]\n500[piety_i] -> 300[gold_i]\n1000[piety_i] -> 650[gold_i]\n1500[piety_i] -> 1000[gold_i]"
