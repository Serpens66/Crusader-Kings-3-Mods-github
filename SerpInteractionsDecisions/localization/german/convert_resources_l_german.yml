# General
 convert_resources_decision_t:0 "Versammelt den Rat"
 convert_resources_decision_desc:0 "Versammelt den Rat um Lösungen für die finanzielle [gold_i] Situation zu besprechen"
 convert_resources_decision_tt:0 "Bietet mehrere Möglichkeiten um an [gold_i] zu kommen."
 convert_resources_decision_confirm:0 "Versammelt sie"
