# Prestige
 convert_resources_events.02.t:0 "Ratskanzler anwesend"
 convert_resources_events.02.desc:0 "\"Wieviel [gold] [gold_i] benötigt Ihr in Austausch für politische Gefallen?\"\n\nIhr erhaltet die Hälfte [gold] sofort und die Andere als [income].\nWählt eines:\n300[prestige_i] -> 150[gold_i]\n500[prestige_i] -> 300[gold_i]\n1000[prestige_i] -> 650[gold_i]\n1500[prestige_i] -> 1000[gold_i]"
 convert_resources_events.02.a:0 "300[prestige_i] -> 150[gold_i]"
 convert_resources_events.02.b:0 "500[prestige_i] -> 300[gold_i]"
 convert_resources_events.02.c:0 "1000[prestige_i] -> 650[gold_i]"
 convert_resources_events.02.d:0 "1500[prestige_i] -> 1000[gold_i]"
 convert_resources_events.02.e:0 "Ich habe meine Meinung geändert."
 convert_resources_events.02.e.tt:0 "Wechselt das Thema."

# Piety
 convert_resources_events.03.t:0 "Ratsprediger anwesend"
 convert_resources_events.03.desc:0 "\"Wieviel [gold] [gold_i] benötigt Ihr in Austausch für theologische Gefallen?\"\n\nIhr erhaltet die Hälfte [gold] sofort und die Andere als [income].\nWählt eines:\n300[piety_i] -> 150[gold_i]\n500[piety_i] -> 300[gold_i]\n1000[piety_i] -> 650[gold_i]\n1500[piety_i] -> 1000[gold_i]"
 convert_resources_events.03.a:0 "300[piety_i] -> 150[gold_i]"
 convert_resources_events.03.b:0 "500[piety_i] -> 300[gold_i]"
 convert_resources_events.03.c:0 "1000[piety_i] -> 650[gold_i]"
 convert_resources_events.03.d:0 "1500[piety_i] -> 1000[gold_i]"
 convert_resources_events.03.e:0 "Ich habe meine Meinung geändert."
 convert_resources_events.03.e.tt:0 "Wechselt das Thema."

# Loan
 convert_resources_events.04.t:0 "Ratsverwalter anwesend"
 convert_resources_events.04.desc:0 "\"Wieviel [gold] [gold_i] sollen wir #S leihen#!?\"\n\nWählt eines:\n\n150[gold_i] -> 200[gold_i] 5 years ~6.67%\n300[gold_i] -> 350[gold_i] 6 years ~2.78%\n500[gold_i] -> 625[gold_i] 10 years ~2.50%\n1000[gold_i] -> 1250[gold_i] 15 years ~1.67%"
 convert_resources_events.04.a:0 "Kleiner Kredit."
 convert_resources_events.04.b:0 "Mittlerer Kredit."
 convert_resources_events.04.c:0 "Erheblicher Kredit."
 convert_resources_events.04.d:0 "Großer Kredit."
 convert_resources_events.04.e:0 "Ich habe meine Meinung geändert."
 convert_resources_events.04.e.tt:0 "Wechselt das Thema."

# Loan_expensive
 convert_resources_events.05.t:0 "Ratsverwalter anwesend"
 convert_resources_events.05.desc:0 "\"Wieviel [gold] [gold_i] sollen wir #S leihen#!?\"\nThe interest is based on my age and health.\n\nWählt eines:\n150[gold_i] -> 200[gold_i] 3 years ~11.11%\n300[gold_i] -> 375[gold_i] 4 years ~6.25%\n500[gold_i] -> 650[gold_i] 8 years ~3.75%\n1000[gold_i] -> 1300[gold_i] 10 years ~3.00%"
 convert_resources_events.05.a:0 "Kleiner Kredit."
 convert_resources_events.05.b:0 "Mittlerer Kredit."
 convert_resources_events.05.c:0 "Erheblicher Kredit."
 convert_resources_events.05.d:0 "Großer Kredit."
 convert_resources_events.05.e:0 "Ich habe meine Meinung geändert."
 convert_resources_events.05.e.tt:0 "Wechselt das Thema."

# Extortion
 convert_resources_events.06.t:0 "Ratsmarschall anwesend"
 convert_resources_events.06.desc:0 "\"Wieviel [gold] [gold_i] sollen wir ihnen gewaltsam abnehmen?\"\n\nIhr erhaltet die Hälfte [gold] sofort und die Andere als [income].\nDies wird Zahlungen von all Euren [courtiers] und direkten [vassals], mit Ausnahme von [children], Euer [spouse] und Euer [player_heir] erzwingen. Den Leuten wird dies nicht gefallen und in manchen Fällen werdet Ihr #N Gewalt #! anwenden müssen, um die geforderte Summe [gold_i] zu erhalten!"
 convert_resources_events.06.a:0 "Knüpft jedem eine kleine Summe ab. 150 [gold_i]"
 convert_resources_events.06.b:0 "Verlangt einen mittelhohen Betrag. 300 [gold_i]"
 convert_resources_events.06.c:0 "Zwingt Alle für jegliche Ausgaben aufzukommen. 500 [gold_i]"
 convert_resources_events.06.d:0 "Nehmt Ihnen alles was sie haben! 1000 [gold_i]"
 convert_resources_events.06.e:0 "Ich habe meine Meinung geändert."
 convert_resources_events.06.e.tt:0 "Wechselt das Thema."

# Give Loan
 convert_resources_events.07.t:0 "Ratsverwalter anwesend"
 convert_resources_events.07.desc:0 "\"Wieviel [gold] [gold_i] sollen wir #S verleihen#!?\"\n\nWählt eines:\n150[gold_i] -> 225[gold_i] 5 years ~10.00%\n300[gold_i] -> 400[gold_i] 6 years ~5.56%\n500[gold_i] -> 650[gold_i] 8 years ~3.75%\n1000[gold_i] -> 1300[gold_i] 14 years ~2.14%"
 convert_resources_events.07.a:0 "Kleine Kreditvergabe."
 convert_resources_events.07.b:0 "Mittlere Kreditvergabe."
 convert_resources_events.07.c:0 "Erhebliche Kreditvergabe."
 convert_resources_events.07.d:0 "Große Kreditvergabe."
 convert_resources_events.07.e:0 "Ich habe meine Meinung geändert."
 convert_resources_events.07.e.tt:0 "Wechselt das Thema."

