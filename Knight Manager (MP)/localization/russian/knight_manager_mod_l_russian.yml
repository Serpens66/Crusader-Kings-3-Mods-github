l_russian:

 km_knight_manager: "Управление Рыцарями"
 km_knight_manager_usage_tt: "Снимите флажки, чтобы запретить определенным группам персонажей становиться рыцарями. Если флажок снят, все персонажи выбранной группы больше не будут рыцарями, а также не будут отображаться в списке. Если вы хотите вручную разрешить определенному персонажу этой группы служить рыцарем, снимите флажок У.Р., прежде чем запретить его группе становиться рыцарями."
 
 km_toggle_kin_cannot_be_knight: "Моя династия"
 km_toggle_kin_cannot_be_knight_tt: "Если включено, персонажи моей династии могут служить рыцарями."
 
 km_toggle_children_cannot_be_knight: "Мои потомки"
 km_toggle_children_cannot_be_knight_tt: "Если включено, мои дети и внуки могут служить рыцарями."
 
 km_toggle_family_spouses_cannot_be_knight: "Семья - Супруги"
 km_toggle_family_spouses_cannot_be_knight_tt: "Если включено, мой супруг и супруги моих детей могут служить рыцарями."
 
 km_toggle_councillors_cannot_be_knight: "совет / [court_positions]"
 km_toggle_councillors_cannot_be_knight_tt: "Если включено, мои советники и мой врач могут служить рыцарями. Не влияет на позицию Телохранителя и Гаруда, так как они будут поддерживать вас в бою. "
 
 km_toggle_my_lovers_cannot_be_knight: "Мои любовники"
 km_toggle_my_lovers_cannot_be_knight_tt: "Если включено, мои любовники и родственные души могут служить рыцарями."
 
 km_toggle_my_heir_cannot_be_knight: "Мой наследник"
 km_toggle_my_heir_cannot_be_knight_tt: "Если включено, мой наследник может служить рыцарем."
 
 km_toggle_bad_fighters_cannot_be_knight: "Неумелые бойцы"
 km_toggle_bad_fighters_cannot_be_knight_tt: "Если включено, неумелые бойцы (доблесть ниже 6) могут служить рыцарями."
 
 km_toggle_average_fighters_cannot_be_knight: "Обычные бойцы"
 km_toggle_average_fighters_cannot_be_knight_tt: "Если включено, то обычные бойцы (доблесть ниже 13) могут служить рыцарями."
 
 km_toggle_exclude_label_tt: "Если выключено, персонаж исключается из настроек Управления Рыцарями и может стать рыцарем."
 km_toggle_exclude_label: "У.Р."
 
 # google translate
 knight_manager_mod_vassals_label: "Мои вассалы"
 knight_manager_mod_vassals_tooltip: "Если включено, мои вассалы могут служить рыцарем."