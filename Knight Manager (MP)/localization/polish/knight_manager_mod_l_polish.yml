l_polish:

 km_knight_manager: "Menedżer Rycerzy"
 km_knight_manager_usage_tt: "#S Odznacz#! pola wyboru, aby uniemożliwić poszczególnym grupom postaci służenia jako [Concept( 'knight', 'rycerze' )|E]. W momencie odznaczenia pola wszystkie postacie z danej grupy nie będą już [Concept( 'knights', 'rycerzami' )|E], a także nie będą się już pojawiać na liście rycerzy. Jeśli chcesz ręcznie zezwolić określonej postaci z tej grupy na pełnienie roli [Concept( 'knight', 'rycerza' )|E], odznacz na liście rycerzy jego pole wyboru oznaczone jako \"M.R.\" przed uniemożliwieniem jego grupom pełnienia funkcji [Concept( 'knight', 'rycerza' )|E].\n\nTe ustawienia powiązane są z twoją obecną postacią, tak więc jeżeli z jakiegoś powodu ją zmienisz, będziesz musiał skonfigurować je ponownie!"

 km_toggle_kin_cannot_be_knight: "Moja dynastia"
